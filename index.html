<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ada yang Mau Ngomong 👀</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
        radial-gradient(circle at 10% 20%,#ffffff80 0 3%,transparent 4%),
        radial-gradient(circle at 90% 80%,#ffffff70 0 4%,transparent 5%),
        linear-gradient(135deg,#ffd4e5,#ddd2ff,#ccecff);
}


/* =========================
   BACKGROUND
========================= */

.bubble{
    position:fixed;
    border-radius:50%;
    background:#ffffff35;
    animation:naik 9s infinite ease-in-out;
    pointer-events:none;
}

.b1{
    width:90px;
    height:90px;
    left:5%;
    bottom:-100px;
}

.b2{
    width:150px;
    height:150px;
    right:-60px;
    bottom:-160px;
    animation-delay:2s;
}

.b3{
    width:60px;
    height:60px;
    left:70%;
    bottom:-70px;
    animation-delay:4s;
}

@keyframes naik{

    0%{
        transform:translateY(0);
        opacity:0;
    }

    30%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh);
        opacity:0;
    }

}


/* =========================
   CARD
========================= */

.card{

    width:90%;
    max-width:430px;

    padding:35px 28px;

    text-align:center;

    background:rgba(255,255,255,.84);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.8);

    border-radius:32px;

    box-shadow:
        0 25px 60px rgba(80,40,100,.2),
        inset 0 1px 0 white;

    position:relative;
    z-index:5;

    animation:masuk .7s ease;

}

.hidden{
    display:none;
}

@keyframes masuk{

    from{
        opacity:0;
        transform:translateY(25px) scale(.9);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


/* =========================
   ICON
========================= */

.icon{

    width:90px;
    height:90px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:
        linear-gradient(135deg,#ffb5d2,#c9b5ff);

    box-shadow:
        0 12px 30px rgba(190,100,180,.25);

    font-size:45px;

    animation:melayang 2.5s infinite ease-in-out;

}

@keyframes melayang{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


/* =========================
   TEXT
========================= */

h1{

    color:#d5528b;

    font-size:27px;

    margin:22px 0 12px;

}

p{

    color:#555;

    font-size:16px;

    line-height:1.8;

}

.typing{

    min-height:130px;

}


/* =========================
   INPUT
========================= */

input{

    width:100%;

    padding:15px;

    border:none;
    outline:none;

    border-radius:17px;

    background:white;

    box-shadow:
        0 8px 25px rgba(100,70,120,.12);

    text-align:center;

    font-size:16px;

    margin:10px 0 20px;

}


/* =========================
   BUTTON
========================= */

button{

    border:none;

    padding:14px 25px;

    border-radius:17px;

    color:white;

    background:
        linear-gradient(135deg,#ee6da3,#a977df);

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 10px 25px rgba(200,90,150,.3);

    transition:.25s;

}

button:hover{

    transform:translateY(-3px) scale(1.04);

}

button:active{

    transform:scale(.95);

}


/* =========================
   MUSIC
========================= */

.music{

    position:fixed;

    top:18px;
    right:18px;

    width:48px;
    height:48px;

    padding:0;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:20;

    font-size:20px;

}


/* =========================
   OPTION BUTTON
========================= */

.pilihan{

    display:flex;

    flex-direction:column;

    gap:12px;

    margin-top:15px;

}

.pilihan button{

    width:100%;

    background:white;

    color:#555;

    box-shadow:
        0 7px 20px rgba(100,70,120,.12);

}

.pilihan button:hover{

    background:#fff0f7;

    color:#d64f89;

}


/* =========================
   LOADING
========================= */

.loading{

    width:100%;

    height:13px;

    background:#eee;

    border-radius:20px;

    overflow:hidden;

    margin:25px 0 10px;

}

.progress{

    height:100%;

    width:0%;

    background:
        linear-gradient(90deg,#ef75a8,#a977df);

    border-radius:20px;

    transition:.1s;

}

.percent{

    font-weight:bold;

    color:#d5528b;

}


/* =========================
   CONFETTI
========================= */

.confetti{

    position:fixed;

    top:-30px;

    pointer-events:none;

    z-index:10;

    animation:jatuh linear forwards;

}

@keyframes jatuh{

    to{

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;

    }

}


/* =========================
   FINAL
========================= */

.final-heart{

    font-size:75px;

    animation:denyut 1.4s infinite;

}

@keyframes denyut{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}

.final{

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.94),
            rgba(255,239,248,.9)
        );

}

.small{

    font-size:13px;

    color:#999;

}

</style>

</head>

<body>


<!-- BACKGROUND -->

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>


<!-- MUSIK -->

<button
    class="music"
    id="musicBtn"
    onclick="toggleMusik()">

    🎵

</button>

<audio id="lagu" loop>

    <source
        src="musik_surprise.mp3"
        type="audio/mpeg">

</audio>


<!-- =========================
     HALAMAN 1
========================= -->

<div class="card" id="halaman1">

    <div class="icon">
        👀
    </div>

    <h1>Eh... kamu.</h1>

    <p class="typing" id="teks1"></p>

    <input
        id="nama"
        type="text"
        placeholder="Masukkan nama kamu..."
    >

    <button onclick="mulai()">
        Oke, lanjut 👀
    </button>

</div>


<!-- =========================
     HALAMAN 2
========================= -->

<div class="card hidden" id="halaman2">

    <div class="icon">
        🕵️
    </div>

    <h1>Hmm... mencurigakan.</h1>

    <p class="typing" id="teks2"></p>

    <button onclick="pertanyaan()">
        Apa? 👀
    </button>

</div>


<!-- =========================
     HALAMAN 3
========================= -->

<div class="card hidden" id="halaman3">

    <div class="icon">
        🤨
    </div>

    <h1>Pertanyaan penting.</h1>

    <p>
        Apakah kamu orang yang suka penasaran?
    </p>

    <div class="pilihan">

        <button onclick="jawaban()">
            Iya 😭
        </button>

        <button onclick="jawaban()">
            Nggak 😎
        </button>

    </div>

</div>


<!-- =========================
     HALAMAN 4
========================= -->

<div class="card hidden" id="halaman4">

    <div class="icon">
        🔎
    </div>

    <h1>Petunjuk pertama...</h1>

    <p class="typing" id="teks4"></p>

    <button onclick="petunjuk2()">
        Lanjut 🔍
    </button>

</div>


<!-- =========================
     HALAMAN 5
========================= -->

<div class="card hidden" id="halaman5">

    <div class="icon">
        🧐
    </div>

    <h1>Petunjuk kedua...</h1>

    <p class="typing" id="teks5"></p>

    <button onclick="petunjuk3()">
        Hmm... lanjut 👀
    </button>

</div>


<!-- =========================
     HALAMAN 6
========================= -->

<div class="card hidden" id="halaman6">

    <div class="icon">
        🚨
    </div>

    <h1>HASIL SEMENTARA</h1>

    <p>
        Sistem sedang melakukan penyelidikan...
    </p>

    <div class="loading">

        <div
            class="progress"
            id="progress">
        </div>

    </div>

    <div class="percent" id="percent">
        0%
    </div>

</div>


<!-- =========================
     HALAMAN 7
========================= -->

<div class="card hidden" id="halaman7">

    <div class="icon">
        🥁
    </div>

    <h1>HASIL DITEMUKAN!</h1>

    <p class="typing" id="teks7"></p>

    <button onclick="hasil()">
        Lihat hasil 😭
    </button>

</div>


<!-- =========================
     HALAMAN AKHIR
========================= -->

<div class="card hidden final" id="akhir">

    <div class="final-heart">
        💗
    </div>

    <h1 id="namaAkhir"></h1>

    <p class="typing" id="teksAkhir"></p>

    <p class="small">
        🏆 Kasus berhasil diselesaikan.
    </p>

</div>


<script>


/* =========================
   VARIABEL
========================= */

let nama = "";

let musikNyala = false;


/* =========================
   EFEK KETIK
========================= */

function ketik(element,text,kecepatan=35){

    element.innerHTML="";

    let i=0;

    function tulis(){

        if(i<text.length){

            if(text.substring(i,i+4)==="<br>"){

                element.innerHTML+="<br>";

                i+=4;

            }

            else{

                element.innerHTML+=text.charAt(i);

                i++;

            }

            setTimeout(tulis,kecepatan);

        }

    }

    tulis();

}


/* =========================
   MUSIK
========================= */

function mulaiMusik(){

    const lagu=
        document.getElementById("lagu");

    lagu.play()
    .then(()=>{

        musikNyala=true;

        document.getElementById("musicBtn")
        .innerHTML="🔊";

    })
    .catch(()=>{

        console.log("Autoplay diblokir browser.");

    });

}


function toggleMusik(){

    const lagu=
        document.getElementById("lagu");

    const tombol=
        document.getElementById("musicBtn");


    if(lagu.paused){

        lagu.play();

        tombol.innerHTML="🔊";

        musikNyala=true;

    }

    else{

        lagu.pause();

        tombol.innerHTML="🔇";

        musikNyala=false;

    }

}


/* =========================
   GANTI HALAMAN
========================= */

function tampil(id){

    document
    .querySelectorAll(".card")
    .forEach(card=>{

        card.classList.add("hidden");

    });

    document
    .getElementById(id)
    .classList.remove("hidden");

}


/* =========================
   HALAMAN 1
========================= */

window.onload=function(){

    ketik(

        document.getElementById("teks1"),

        "Iya, kamu. Jangan pura-pura nggak lihat. 😭<br><br>Ada sesuatu yang mau disampaikan... tapi sebelum itu, boleh kasih tahu namamu dulu?"

    );

};


/* =========================
   MULAI
========================= */

function mulai(){

    nama=
        document
        .getElementById("nama")
        .value
        .trim();


    if(nama===""){

        alert("Namanya belum diisi 😭");

        return;

    }


    /* MUSIK DIMULAI */

    mulaiMusik();


    tampil("halaman2");


    ketik(

        document.getElementById("teks2"),

        "Oke, " + nama + "...<br><br>Sebenarnya ada sedikit masalah di sini. 🤨<br><br>Dan sepertinya kamu adalah bagian dari masalah tersebut. 😭"

    );

}


/* =========================
   PERTANYAAN
========================= */

function pertanyaan(){

    tampil("halaman3");

}


/* =========================
   JAWABAN
========================= */

function jawaban(){

    tampil("halaman4");


    ketik(

        document.getElementById("teks4"),

        "Tenang... pilihanmu sudah dicatat oleh sistem. 📝<br><br>Walaupun sebenarnya sistemnya cuma aku yang bikin. 😭😂<br><br>Tapi penyelidikan harus tetap dilanjutkan."

    );

}


/* =========================
   PETUNJUK 2
========================= */

function petunjuk2(){

    tampil("halaman5");


    ketik(

        document.getElementById("teks5"),

        "Petunjuk pertama: orang ini kemungkinan besar sedang melihat layar ini sekarang. 👀<br><br>Petunjuk kedua: orang ini belum sadar kalau sebentar lagi bakal ketahuan. 😂"

    );

}


/* =========================
   PETUNJUK 3
========================= */

function petunjuk3(){

    tampil("halaman6");


    mulaiLoading();

}


/* =========================
   LOADING
========================= */

function mulaiLoading(){

    let progress=0;

    const bar=
        document.getElementById("progress");

    const persen=
        document.getElementById("percent");


    const interval=
        setInterval(()=>{

            progress++;

            bar.style.width=
                progress+"%";

            persen.innerHTML=
                progress+"%";


            if(progress>=100){

                clearInterval(interval);

                setTimeout(()=>{

                    tampil("halaman7");


                    ketik(

                        document.getElementById("teks7"),

                        "🥁🥁🥁<br><br>Setelah dilakukan penelitian yang sangat serius...<br><br>selama kurang lebih 0,0003 detik... 😂<br><br><b>tersangka akhirnya berhasil ditemukan!</b>"

                    );

                },800);

            }

        },35);

}


/* =========================
   HASIL
========================= */

function hasil(){

    tampil("akhir");


    document
    .getElementById("namaAkhir")
    .innerHTML=
        "KETANGKAP! 😭<br>" + nama;


    ketik(

        document.getElementById("teksAkhir"),

        "Jadi sebenarnya nggak ada kasus besar. 😂<br><br>Aku cuma mau bilang...<br><br><b>semoga hari kamu menyenangkan. 💗</b><br><br>Kalau hari ini sempat bikin capek, semoga setelah melihat ini kamu bisa senyum sedikit. 😆<br><br>Dan kalau tadi sempat penasaran...<br><br><b>berarti misinya berhasil. 🎉</b><br><br>Terima kasih sudah mau mengikuti penyelidikan paling nggak penting hari ini. 🕵️‍♂️"

    );


    confetti(60);

}


/* =========================
   CONFETTI
========================= */

function confetti(jumlah){

    const simbol=[
        "🎉",
        "✨",
        "💗",
        "💕",
        "🌸",
        "⭐",
        "😂",
        "🎊"
    ];


    for(let i=0;i<jumlah;i++){

        setTimeout(()=>{

            const c=
                document.createElement("div");

            c.className="confetti";


            c.innerHTML=
                simbol[
                    Math.floor(
                        Math.random()*simbol.length
                    )
                ];


            c.style.left=
                Math.random()*100+"vw";


            c.style.fontSize=
                (16+Math.random()*25)+"px";


            c.style.animationDuration=
                (3+Math.random()*4)+"s";


            document.body.appendChild(c);


            setTimeout(()=>{

                c.remove();

            },7000);


        },i*70);

    }

}

</script>

</body>
</html>
